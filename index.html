<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classic Car Alerts</title>
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #1a1a24;
      --surface2: #252533;
      --accent: #e85d3a;
      --accent2: #f09b5a;
      --text: #ededef;
      --text2: #9898a8;
      --green: #4ade80;
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 100px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 8px 0 4px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      color: var(--text2);
      font-size: 14px;
      margin-bottom: 20px;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      background: var(--surface2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row > * { flex: 1; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.7; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
    }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .alert-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text2);
      margin: 4px 4px 0 0;
    }
    .alert-badge.active {
      background: rgba(232, 93, 58, 0.15);
      color: var(--accent);
      border: 1px solid rgba(232, 93, 58, 0.2);
    }
    .listing {
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .listing:last-child { border: none; }
    .listing-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .listing-meta {
      font-size: 13px;
      color: var(--text2);
      display: flex;
      gap: 12px;
    }
    .listing-meta span { display: flex; align-items: center; gap: 4px; }
    .listing-price {
      font-size: 16px;
      font-weight: 700;
      color: var(--green);
      margin-top: 4px;
    }
    .new-tag {
      background: var(--accent);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      margin-left: 8px;
      text-transform: uppercase;
    }
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text2);
    }
    .empty svg { margin-bottom: 12px; opacity: 0.3; }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-dot.green { background: var(--green); }
    .status-dot.yellow { background: #facc15; }
    .status-dot.red { background: #f87171; }
    .sms-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .sms-input-row input { margin-bottom: 0; flex: 1; }
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 12px 16px;
      padding-bottom: 28px;
      max-width: 480px;
      margin: 0 auto;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5f7;
        --surface: #ffffff;
        --surface2: #e8e8ed;
        --text: #1d1d1f;
        --text2: #86868b;
      }
    }
  </style>
</head>
<body>
  <h1>🚗 Classic Car Alerts</h1>
  <p class="sub">For Tyler — get SMS alerts when pre-1974 classics show up</p>

  <!-- Alert Settings -->
  <div class="card">
    <div class="card-title">Alert Settings</div>
    <div class="row">
      <div>
        <label>Make</label>
        <input type="text" id="make" placeholder="Any" value="">
      </div>
      <div>
        <label>Model</label>
        <input type="text" id="model" placeholder="Any" value="">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Min Year</label>
        <select id="minYear">
          <option value="1900">1900</option>
          <option value="1920">1920</option>
          <option value="1930">1930</option>
          <option value="1940">1940</option>
          <option value="1950">1950</option>
          <option value="1960">1960</option>
          <option value="1965">1965</option>
          <option value="1969" selected>1969</option>
          <option value="1970">1970</option>
          <option value="1971">1971</option>
          <option value="1972">1972</option>
          <option value="1973">1973</option>
        </select>
      </div>
      <div>
        <label>Max Year</label>
        <select id="maxYear">
          <option value="1973">1973</option>
          <option value="1972">1972</option>
          <option value="1971">1971</option>
          <option value="1970">1970</option>
          <option value="1969">1969</option>
          <option value="1965">1965</option>
          <option value="1960">1960</option>
          <option value="1950">1950</option>
          <option value="1940">1940</option>
          <option value="1930">1930</option>
          <option value="1920">1920</option>
          <option value="1900">1900</option>
        </select>
      </div>
    </div>
    <label>Max Price</label>
    <input type="number" id="maxPrice" placeholder="$20,000" value="20000">
    <label>Search Radius (miles)</label>
    <select id="radius">
      <option value="50">50 miles</option>
      <option value="100">100 miles</option>
      <option value="200" selected>200 miles</option>
      <option value="500">500 miles</option>
      <option value="1000">1,000 miles</option>
    </select>
    <label style="margin-top:4px">SMS Phone Number</label>
    <div class="sms-input-row">
      <input type="tel" id="phone" placeholder="(916) 555-0123" value="">
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-primary" onclick="saveAlert()">🔔 Save Alert</button>
      <button class="btn btn-secondary" onclick="testSearch()">🔍 Test Search</button>
    </div>
  </div>

  <!-- Active Alerts -->
  <div class="card">
    <div class="card-title">Active Alerts</div>
    <div id="activeAlerts">
      <div class="empty" style="padding:20px">
        <span style="opacity:0.4">No alerts saved yet. Set your criteria above.</span>
      </div>
    </div>
  </div>

  <!-- Recent Listings -->
  <div class="card">
    <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
      <span>Recent Listings</span>
      <span class="status-dot green" id="statusDot"></span>
      <span style="font-size:12px;font-weight:400;color:var(--text2)" id="statusText">Watching...</span>
    </div>
    <div id="listings">
      <div class="empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M5 17a4 4 0 0 1 0-8h14a4 4 0 0 1 0 8H5Z"/>
          <path d="M8 9V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v4"/>
          <path d="M12 9v8"/>
        </svg>
        <p>No listings yet</p>
        <p style="font-size:13px;margin-top:4px">Save an alert and we'll start watching Craigslist for new listings</p>
      </div>
    </div>
  </div>

  <!-- Quick Links -->
  <div class="card">
    <div class="card-title">Quick Search Links</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button class="btn-secondary" style="width:auto;padding:10px 16px;font-size:13px" onclick="openFB()">📘 Facebook</button>
      <button class="btn-secondary" style="width:auto;padding:10px 16px;font-size:13px" onclick="openCL()">📰 Craigslist</button>
      <button class="btn-secondary" style="width:auto;padding:10px 16px;font-size:13px" onclick="openAT()">🏎️ AutoTempest</button>
      <button class="btn-secondary" style="width:auto;padding:10px 16px;font-size:13px" onclick="openOfferUp()">📱 OfferUp</button>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar" style="display:flex;gap:8px">
    <button class="btn btn-secondary" style="flex:1" onclick="refreshNow()">🔄 Refresh</button>
    <button class="btn btn-primary" style="flex:1" onclick="saveAlert()">+ New Alert</button>
  </div>

  <script>
    let alerts = JSON.parse(localStorage.getItem('carAlerts') || '[]');
    let listings = [];

    function saveAlert() {
      const alert = {
        id: Date.now(),
        make: document.getElementById('make').value,
        model: document.getElementById('model').value,
        minYear: document.getElementById('minYear').value,
        maxYear: document.getElementById('maxYear').value,
        maxPrice: document.getElementById('maxPrice').value,
        radius: document.getElementById('radius').value,
        phone: document.getElementById('phone').value,
        createdAt: new Date().toISOString()
      };
      
      if (!alert.phone) {
        alert('Please enter a phone number for SMS alerts');
        return;
      }

      alerts.unshift(alert);
      localStorage.setItem('carAlerts', JSON.stringify(alerts));
      renderAlerts();
      
      // Notify backend
      fetch('/api/alerts', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(alert)
      }).catch(() => {});

      // Run a test search
      testSearch();
    }

    function deleteAlert(id) {
      alerts = alerts.filter(a => a.id !== id);
      localStorage.setItem('carAlerts', JSON.stringify(alerts));
      renderAlerts();
      
      fetch(`/api/alerts/${id}`, { method: 'DELETE' }).catch(() => {});
    }

    function renderAlerts() {
      const container = document.getElementById('activeAlerts');
      if (alerts.length === 0) {
        container.innerHTML = `<div class="empty" style="padding:20px"><span style="opacity:0.4">No alerts saved yet.</span></div>`;
        return;
      }
      container.innerHTML = alerts.map(a => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
          <div>
            <div style="font-weight:600;font-size:14px">${a.make || 'Any'} ${a.model || 'Any'} (${a.minYear}-${a.maxYear})</div>
            <div style="font-size:12px;color:var(--text2)">≤ $${parseInt(a.maxPrice).toLocaleString()} · ${a.radius}mi · ${a.phone}</div>
          </div>
          <button onclick="deleteAlert(${a.id})" style="background:none;border:none;color:#f87171;font-size:18px;cursor:pointer;padding:4px">✕</button>
        </div>
      `).join('');
    }

    async function testSearch() {
      const make = document.getElementById('make').value;
      const model = document.getElementById('model').value;
      const minYear = document.getElementById('minYear').value;
      const maxYear = document.getElementById('maxYear').value;
      const maxPrice = document.getElementById('maxPrice').value;
      const radius = document.getElementById('radius').value;

      document.getElementById('statusText').textContent = 'Searching...';
      document.getElementById('statusDot').className = 'status-dot yellow';

      // Build Craigslist RSS URL
      const queryParts = [];
      if (make) queryParts.push(make);
      if (model) queryParts.push(model);
      
      // Craigslist search URL builder
      const baseUrl = 'https://sacramento.craigslist.org/search/cta';
      const params = new URLSearchParams();
      if (queryParts.length) params.set('query', queryParts.join(' '));
      if (maxPrice) params.set('max_price', maxPrice);
      if (radius) params.set('search_distance', radius);
      params.set('min_auto_year', minYear);
      params.set('max_auto_year', maxYear);
      params.set('sort', 'date');
      
      const searchUrl = baseUrl + '?' + params.toString();

      // Try to fetch via RSS proxy
      try {
        const resp = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(searchUrl)}`);
        const html = await resp.text();
        // Parse listings
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const items = doc.querySelectorAll('.cl-search-result');
        
        listings = Array.from(items).slice(0, 20).map(item => {
          const titleEl = item.querySelector('.titlestring') || item.querySelector('a');
          const priceEl = item.querySelector('.priceinfo') || item.querySelector('.price');
          const metaEl = item.querySelector('.meta');
          return {
            title: titleEl?.textContent?.trim() || 'Unknown',
            url: titleEl?.getAttribute('href') || '#',
            price: priceEl?.textContent?.trim() || 'N/A',
            meta: metaEl?.textContent?.trim() || ''
          };
        });

        if (listings.length === 0) {
          // Fallback to showing the direct link
          document.getElementById('listings').innerHTML = `
            <div class="empty">
              <p>No results parsed. Open directly:</p>
              <button class="btn btn-primary" style="margin-top:12px" onclick="window.open('${searchUrl}','_blank')">
                📰 View on Craigslist
              </button>
            </div>
          `;
        } else {
          renderListings();
        }

        document.getElementById('statusText').textContent = '✓ Found ' + listings.length + ' listings';
        document.getElementById('statusDot').className = 'status-dot green';
      } catch (e) {
        // Fallback: show direct link
        document.getElementById('listings').innerHTML = `
          <div class="empty">
            <p style="color:var(--accent);margin-bottom:8px">Direct search opened — Craigslist blocks automated fetches</p>
            <button class="btn btn-primary" onclick="window.open('${searchUrl}','_blank')">
              📰 Open Craigslist Search
            </button>
            <p style="font-size:12px;color:var(--text2);margin-top:12px">
              Year: ${minYear}-${maxYear} · ${radius}mi · Max $${parseInt(maxPrice).toLocaleString()}
            </p>
          </div>
        `;
        document.getElementById('statusText').textContent = '⚠️ Opened in browser';
        document.getElementById('statusDot').className = 'status-dot yellow';
      }
    }

    function renderListings() {
      const container = document.getElementById('listings');
      container.innerHTML = listings.map((l, i) => `
        <div class="listing" onclick="window.open('${l.url.startsWith('http') ? l.url : 'https://sacramento.craigslist.org' + l.url}','_blank')" style="cursor:pointer">
          <div class="listing-title">
            ${l.title}
            ${i === 0 ? '<span class="new-tag">New</span>' : ''}
          </div>
          <div class="listing-price">${l.price}</div>
          <div class="listing-meta">
            <span>📍 ${l.meta || 'Sacramento'}</span>
          </div>
        </div>
      `).join('');
    }

    function refreshNow() {
      if (alerts.length > 0) {
        const a = alerts[0];
        document.getElementById('make').value = a.make;
        document.getElementById('model').value = a.model;
        document.getElementById('minYear').value = a.minYear;
        document.getElementById('maxYear').value = a.maxYear;
        document.getElementById('maxPrice').value = a.maxPrice;
        document.getElementById('radius').value = a.radius;
        testSearch();
      }
    }

    // Quick links
    function openFB() {
      const minYear = document.getElementById('minYear').value;
      const maxYear = document.getElementById('maxYear').value;
      const make = document.getElementById('make').value;
      window.open(`https://www.facebook.com/marketplace/search/?query=${encodeURIComponent(`${make} ${minYear}-${maxYear}`)}`, '_blank');
    }
    function openCL() {
      const minYear = document.getElementById('minYear').value;
      const maxYear = document.getElementById('maxYear').value;
      const make = document.getElementById('make').value;
      const model = document.getElementById('model').value;
      const maxPrice = document.getElementById('maxPrice').value;
      const radius = document.getElementById('radius').value;
      const q = [make, model, `${minYear}-${maxYear}`].filter(Boolean).join(' ');
      window.open(`https://sacramento.craigslist.org/search/cta?query=${encodeURIComponent(q)}&max_price=${maxPrice}&search_distance=${radius}&min_auto_year=${minYear}&max_auto_year=${maxYear}&sort=date`, '_blank');
    }
    function openAT() {
      window.open('https://www.autotempest.com/', '_blank');
    }
    function openOfferUp() {
      window.open('https://offerup.com/search/?q=classic+car', '_blank');
    }

    // Init
    renderAlerts();
  </script>
</body>
</html>
